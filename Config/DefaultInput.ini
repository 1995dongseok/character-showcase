; Character Portfolio Viewer - Input config
;
; This project uses Enhanced Input exclusively. UInputSettings is a
; config=Input class, so DefaultPlayerInputClass/DefaultInputComponentClass
; must be set HERE (not in Config/DefaultEngine.ini, which UInputSettings
; does not read).
[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Input Mapping Context / Input Action assets (IMC_CharacterViewer, IA_Orbit,
; IA_OrbitPress, IA_Zoom, IA_ResetCamera, IA_ToggleTurntable,
; IA_ToggleCleanView) are Editor-only .uasset files and are not created by
; this agent. ACharacterViewerController creates equivalent transient
; UInputAction/UInputMappingContext objects at runtime when
; bCreateFallbackInputAssets is true and the corresponding Editor asset
; reference is null, so Left-drag orbit / Wheel zoom / R / Space / H work
; without those assets existing. See Docs/CHARACTER_VIEWER_SETUP.md section
; 13 for the exact fallback key bindings and the manual asset spec to
; replace them with real Editor assets later.
