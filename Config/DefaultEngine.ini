; Character Portfolio Viewer - Engine config
; LV_Portfolio (Content/Portfolio/Maps/LV_Portfolio.umap), the DA_Character
; data asset and the BP_CharacterViewerGameMode/WBP_CharacterViewer
; Blueprints referenced below are all created by
; Scripts/CreatePortfolioAssets.py (see Docs/CHARACTER_VIEWER_SETUP.md
; section 13.6). Re-run that script after deleting/renaming any of them.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Portfolio/Maps/LV_Portfolio.LV_Portfolio
EditorStartupMap=/Game/Portfolio/Maps/LV_Portfolio.LV_Portfolio
GlobalDefaultGameMode=/Game/Portfolio/Blueprints/BP_CharacterViewerGameMode.BP_CharacterViewerGameMode_C

; NOTE: DefaultPlayerInputClass/DefaultInputComponentClass are NOT set here.
; UInputSettings is a config=Input class, so it only reads from
; Config/DefaultInput.ini's [/Script/Engine.InputSettings] section, not from
; this file; a copy of those two keys here would silently be ignored. See
; Config/DefaultInput.ini.

; A portfolio viewer should render the character at a fixed, predictable
; exposure regardless of the profile's lights/materials, so default
; auto-exposure is disabled project-wide (scene luminance pinned to 1, ~EV100 3)
; instead of hand-tuning a PostProcessVolume per level; the LV_Portfolio light
; values in Scripts/CreatePortfolioAssets.py are tuned for this. (The early
; near-black smoke-test screenshots were NOT an exposure problem but a key
; light pointing up from under the floor; see Docs/CHARACTER_VIEWER_SETUP.md
; section 13.7.1.)
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False

