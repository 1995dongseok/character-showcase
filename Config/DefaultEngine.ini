; Character Portfolio Viewer - Engine config
; NOTE: LV_Portfolio does not exist yet (no .umap has been created by this
; agent; Editor-only assets are documented as manual steps in
; Docs/CHARACTER_VIEWER_SETUP.md section 13). Until the map is created in the
; Editor, these map settings have no effect there (Editor/PIE fall back to an
; empty transient level, not a crash). A packaged build or -game launch is
; different: UE treats a GameDefaultMap that cannot be found as a fatal
; "Failed to enter" error and exits instead of falling back. Do not run
; -game or a packaged build against this config until LV_Portfolio actually
; exists.
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Portfolio/Maps/LV_Portfolio.LV_Portfolio
EditorStartupMap=/Game/Portfolio/Maps/LV_Portfolio.LV_Portfolio
GlobalDefaultGameMode=/Script/CharacterShowcase.CharacterViewerGameMode

; NOTE: DefaultPlayerInputClass/DefaultInputComponentClass are NOT set here.
; UInputSettings is a config=Input class, so it only reads from
; Config/DefaultInput.ini's [/Script/Engine.InputSettings] section, not from
; this file; a copy of those two keys here would silently be ignored. See
; Config/DefaultInput.ini.
