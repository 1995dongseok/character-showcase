; Character Portfolio Viewer - Engine config
; LV_Portfolio (Content/Portfolio/Maps/LV_Portfolio.umap), the DA_Character
; data asset and the BP_CharacterViewerGameMode/WBP_CharacterViewer
; Blueprints referenced below are all created by
; Scripts/CreatePortfolioAssets.py (see Docs/CHARACTER_VIEWER_SETUP.md
; section 13.6). Re-run that script after deleting/renaming any of them.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Portfolio/Maps/LV_Portfolio.LV_Portfolio
EditorStartupMap=/Game/Portfolio/Maps/LV_Portfolio.LV_Portfolio
GlobalDefaultGameMode=/Game/Portfolio/Blueprints/BP_CharacterViewerGameMode.BP_CharacterViewerGameMode_C

; NOTE: DefaultPlayerInputClass/DefaultInputComponentClass are NOT set here.
; UInputSettings is a config=Input class, so it only reads from
; Config/DefaultInput.ini's [/Script/Engine.InputSettings] section, not from
; this file; a copy of those two keys here would silently be ignored. See
; Config/DefaultInput.ini.

; A portfolio viewer should render the character at a fixed, predictable
; exposure regardless of the profile's lights/materials, so default
; auto-exposure is disabled project-wide (scene luminance pinned to 1, ~EV100 3)
; instead of hand-tuning a PostProcessVolume per level; the LV_Portfolio light
; values in Scripts/CreatePortfolioAssets.py are tuned for this. (The early
; near-black smoke-test screenshots were NOT an exposure problem but a key
; light pointing up from under the floor; see Docs/CHARACTER_VIEWER_SETUP.md
; section 13.7.1.)
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False

; Viewer UI DPI scale (Docs/CHARACTER_VIEWER_SETUP.md section 2, step 9). The
; engine default curve gives 0.666 at 720p, which shrank the right panel to
; ~213 px and clipped its labels. ShortestSide: 720p = 0.8, 1080p = 1.0,
; 1440p = 1.25 (linear in between). The panel width itself is
; clamp(24% of the viewport, 300, 460) Slate units (UCharacterViewerWidget).
[/Script/Engine.UserInterfaceSettings]
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=480,Value=0.6),(Time=720,Value=0.8),(Time=1080,Value=1.0),(Time=1440,Value=1.25),(Time=2160,Value=2.0),(Time=8640,Value=8.0))),ExternalCurve=None)

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=48ABE6C84C6DD0E7A3E5069CF43F3705
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


; Automation (Docs/CHARACTER_VIEWER_SETUP.md 6.17): on this Intel UHD 630 PC a -game window runs at ~4 FPS at 1080p,
; so the editor-side "wait for interactive framerate" gate (default 10 FPS / 600 s) delayed every -game test by 10 minutes.
; Start tests as soon as 1 FPS is reached; the tests have their own latent waits.
[/Script/Engine.AutomationTestSettings]
DefaultInteractiveFramerate=1
DefaultInteractiveFramerateDuration=1
DefaultInteractiveFramerateWaitTime=30
